<script id="math">
// Pure math, no DOM. Mirrors the dojo references so the page cannot teach a wrong rule.
const FM = (() => {
  const sum = a => a.reduce((x, y) => x + y, 0);
  const softmaxMasked = (row, allowed, safe) => {
    if (!allowed.some(Boolean)) return row.map(() => (safe ? 0 : NaN));
    const m = Math.max(...row.filter((_, j) => allowed[j]));
    const e = row.map((v, j) => (allowed[j] ? Math.exp(v - m) : 0));
    const s = sum(e);
    return e.map(v => v / s);
  };
  const allowedMatrix = (valid, causal) =>
    valid.map((qi, i) => valid.map((kj, j) => Boolean(qi && kj && (!causal || j <= i))));
  const attentionWeights = (S, valid, causal, safe) => {
    const A = allowedMatrix(valid, causal);
    return { allowed: A, weights: S.map((row, i) => softmaxMasked(row, A[i], safe)) };
  };
  // Contrastive loss on unit vectors given by angles.
  const logsumexp = r => { const m = Math.max(...r); return m + Math.log(sum(r.map(v => Math.exp(v - m)))); };
  const contrastive = (xa, ya, t, valid) => {
    const idx = valid.map((v, i) => (v ? i : -1)).filter(i => i >= 0);
    const n = idx.length;
    if (!n) return { n, logits: [], probs: [], lossXY: 0, lossYX: 0, loss: 0 };
    const logits = idx.map(i => idx.map(j => Math.cos(xa[i] - ya[j]) / t));
    const ce = L => sum(L.map((row, i) => logsumexp(row) - row[i])) / n;
    const probs = logits.map(r => { const l = logsumexp(r); return r.map(v => Math.exp(v - l)); });
    const lt = logits.map((_, i) => logits.map((_, j) => logits[j][i]));
    const lossXY = ce(logits), lossYX = ce(lt);
    return { n, idx, logits, probs, lossXY, lossYX, loss: 0.5 * (lossXY + lossYX) };
  };
  // Single-channel cross-correlation.
  const outSize = (n, k, s, p) => Math.floor((n + 2 * p - k) / s) + 1;
  const pad2 = (X, p) => {
    const h = X.length, w = X[0].length;
    return Array.from({ length: h + 2 * p }, (_, i) => Array.from({ length: w + 2 * p }, (_, j) =>
      (i >= p && i < h + p && j >= p && j < w + p ? X[i - p][j - p] : 0)));
  };
  const flipKernel = K => K.slice().reverse().map(r => r.slice().reverse());
  const conv2d = (X, K, s, p, flip) => {
    const kern = flip ? flipKernel(K) : K;
    const P = pad2(X, p), kh = K.length, kw = K[0].length;
    const ho = outSize(X.length, kh, s, p), wo = outSize(X[0].length, kw, s, p);
    if (ho < 1 || wo < 1) return { error: true, ho, wo, P };
    const out = Array.from({ length: ho }, (_, i) => Array.from({ length: wo }, (_, j) => {
      let a = 0;
      for (let u = 0; u < kh; u++) for (let v = 0; v < kw; v++) a += P[i * s + u][j * s + v] * kern[u][v];
      return a;
    }));
    return { out, ho, wo, P, kern };
  };
  const iou = (a, b) => {
    const w = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]));
    const h = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const inter = w * h;
    const area = r => Math.max(0, r[2] - r[0]) * Math.max(0, r[3] - r[1]);
    const union = area(a) + area(b) - inter;
    return { inter, union, iou: union > 0 ? inter / union : 0, w, h };
  };
  const huber = (r, d) => (Math.abs(r) <= d ? 0.5 * r * r : d * (Math.abs(r) - 0.5 * d));
  const huberGrad = (r, d) => Math.max(-d, Math.min(d, r));
  // Masked mean Huber over rows of residuals. "select" ignores invalid rows; "multiply" does mask*value.
  const maskedHuber = (rows, valid, d, method) => {
    const n = valid.filter(Boolean).length;
    if (!n) return 0;
    const per = rows.map((r, i) => (method === 'select' ? (valid[i] ? huber(r, d) : 0) : huber(r, d) * (valid[i] ? 1 : 0)));
    return sum(per) / n;
  };
  const voxel = (pts, origin, size, shape) => {
    const cells = new Map();
    const labels = pts.map(p => {
      const c = [Math.floor((p.x - origin[0]) / size), Math.floor((p.y - origin[1]) / size)];
      const inside = c[0] >= 0 && c[0] < shape[0] && c[1] >= 0 && c[1] < shape[1];
      if (inside) {
        const key = c[0] * shape[1] + c[1]; // row-major: lexicographic by x, then y
        const e = cells.get(key) || { c, n: 0, f: 0 };
        e.n++; e.f += p.f; cells.set(key, e);
      }
      return { c, inside };
    });
    const occupied = [...cells.entries()].sort((a, b) => a[0] - b[0]).map(([, e]) => ({ c: e.c, n: e.n, mean: e.f / e.n }));
    return { labels, occupied };
  };
  const rot = th => [[Math.cos(th), -Math.sin(th)], [Math.sin(th), Math.cos(th)]];
  const mv = (R, v) => [R[0][0] * v[0] + R[0][1] * v[1], R[1][0] * v[0] + R[1][1] * v[1]];
  const mtv = (R, v) => [R[0][0] * v[0] + R[1][0] * v[1], R[0][1] * v[0] + R[1][1] * v[1]];
  // p_current = Rc^T (Rh p + th - tc): rigid inverse is R^T, never a general matrix inverse.
  const egoTransform = (p, h, c) => {
    const w = mv(rot(h.th), p).map((v, i) => v + [h.x, h.y][i]);
    const cur = mtv(rot(c.th), [w[0] - c.x, w[1] - c.y]);
    return { world: w, current: cur };
  };
  return { softmaxMasked, allowedMatrix, attentionWeights, contrastive, outSize, conv2d, flipKernel, iou, huber, huberGrad, maskedHuber, voxel, egoTransform };
})();
if (typeof module !== 'undefined') module.exports = FM;
</script>

<script id="app">
const REPO = 'https://github.com/phi9t/torch_dojo/blob/main/dojo/';
const fmt = (v, d = 3) => (Number.isNaN(v) ? 'NaN' : (Math.abs(v) < 5e-4 ? 0 : v).toFixed(d));
const NS = 'http://www.w3.org/2000/svg';
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function sv(tag, props = {}, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(props || {})) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const heat = (p, color = 'var(--accent)') => `color-mix(in srgb, ${color} ${Math.round(Math.max(0, Math.min(1, p)) * 70)}%, var(--canvas))`;
function slider(label, min, max, step, value, onInput, show = v => v) {
  const out = h('output', {}, show(value));
  const inp = h('input', { type: 'range', min, max, step, value, 'aria-label': label,
    oninput: e => { const v = parseFloat(e.target.value); out.textContent = show(v); onInput(v); } });
  return h('label', { class: 'ctl' }, label, inp, out);
}
function toggle(label, value, onChange, cls = '') {
  const b = h('button', { class: 'chip ' + cls, 'aria-pressed': String(value), onclick: () => {
    value = !value; b.setAttribute('aria-pressed', String(value)); onChange(value); } }, label);
  return b;
}
function choice(label, options, value, onChange) {
  const wrap = h('div', { class: 'chips', role: 'group', 'aria-label': label }, h('span', { class: 'ctl' }, label));
  const bs = options.map(([k, text]) => {
    const b = h('button', { class: 'chip', 'aria-pressed': String(k === value), onclick: () => {
      bs.forEach(x => x.b.setAttribute('aria-pressed', String(x.k === k))); onChange(k); } }, text);
    return { k, b };
  });
  bs.forEach(x => wrap.append(x.b));
  return wrap;
}
function guide({ idea, predict, answer, watch, say, dojo, file, minutes }) {
  return h('div', { class: 'guide' },
    h('div', { class: 'card idea' }, h('h2', {}, 'The idea'), h('p', {}, idea)),
    h('div', { class: 'card' }, h('h2', {}, 'Predict first'), h('p', {}, predict),
      h('details', {}, h('summary', {}, 'Reveal'), h('p', {}, answer))),
    h('div', { class: 'card watch' }, h('h2', {}, 'Watch out'), h('p', {}, watch)),
    h('div', { class: 'card' }, h('h2', {}, 'Say it out loud'), h('p', { class: 'say' }, say)),
    h('div', { class: 'card' }, h('h2', {}, `Dojo ${dojo} · ${minutes} min`),
      h('p', {}, h('a', { href: REPO + file, target: '_blank', rel: 'noopener' }, file))));
}
function lesson(title, lede, stage, g) {
  return h('div', {}, h('h1', {}, title), h('p', { class: 'lede' }, lede), h('div', { class: 'lesson' }, stage, g));
}
function readout(items) {
  return h('div', { class: 'readout' }, items.map(([k, v, cls]) => h('div', {}, h('small', {}, k), h('b', { class: cls || '' }, v))));
}

/* ---------- 1. Masks ---------- */
function masks() {
  const S = [[1.2, .3, -.5, .8, .1], [.4, 1.5, .2, -.3, .9], [-.2, .6, 1.1, .5, 0], [.7, -.1, .4, 1.3, .6], [.2, .8, -.4, .3, 1.4]];
  const st = { valid: [true, true, false, true, true], causal: false, safe: true };
  const body = h('div');
  const draw = () => {
    const { allowed, weights } = FM.attentionWeights(S, st.valid, st.causal, st.safe);
    const t = h('table', { class: 'grid', 'aria-label': 'attention weights' });
    t.append(h('tr', {}, h('th', {}), ...st.valid.map((v, j) => h('th', { class: v ? '' : 'off' }, 'k' + j)), h('th', {})));
    weights.forEach((row, i) => {
      const empty = !allowed[i].some(Boolean);
      t.append(h('tr', {}, h('th', { class: st.valid[i] ? '' : 'off' }, 'q' + i),
        ...row.map((w, j) => allowed[i][j]
          ? h('td', { class: 'cell', style: `background:${heat(w)};color:var(--text)` }, fmt(w, 2))
          : h('td', { class: 'cell no' + (empty && !st.safe ? ' bad' : ''), style: empty && !st.safe ? 'color:var(--red)' : '' }, empty && !st.safe ? 'NaN' : '·')),
        h('th', { class: empty ? (st.safe ? 'good' : 'bad') : '' }, empty ? (st.safe ? 'empty → 0' : 'NaN row') : 'Σ 1')));
    });
    const empties = allowed.filter(r => !r.some(Boolean)).length;
    body.replaceChildren(t, h('p', { class: 'note' }, 'Row = query, column = key. A cell is allowed only if the query AND the key are valid (and, if causal, j ≤ i). Striped cells receive exactly zero weight.'),
      readout([['empty rows', String(empties), empties ? 'warn' : ''], ['row sums', empties && !st.safe ? 'contain NaN' : '1 or 0', empties && !st.safe ? 'bad' : 'good']]));
  };
  const ctl = h('div', { class: 'controls' },
    h('div', { class: 'chips' }, h('span', { class: 'ctl' }, 'valid tokens'), ...st.valid.map((v, i) => toggle('t' + i, v, x => { st.valid[i] = x; draw(); }, 'off'))),
    toggle('causal', st.causal, x => { st.causal = x; draw(); }),
    toggle('safe softmax', st.safe, x => { st.safe = x; draw(); }));
  draw();
  return lesson('Masks decide who may look at whom',
    'Attention scores are a T×T table. A mask is a same-shaped table of yes/no. Padding, causality and "this row has nothing to look at" are all just entries in it.',
    h('div', { class: 'stage' }, ctl, body),
    guide({
      idea: 'allowed[i,j] = valid[i] AND valid[j] AND (j ≤ i if causal). Disallowed scores become −inf, which softmax turns into exactly 0.',
      predict: 'Tokens 0,1,3,4 valid, token 2 invalid, causal on. Which query rows end up with no allowed key?',
      answer: 'Only row 2 (an invalid query). Rows 3 and 4 still see tokens 0,1 (and themselves). Turn "safe softmax" off to watch the empty row become NaN.',
      watch: 'A row of all −inf has max −inf, and −inf − (−inf) = NaN. Fix it BEFORE softmax (give empty rows score 0) and divide by 1 instead of 0. Cleaning NaNs afterwards is too late for the backward pass.',
      say: '"Mask once as a boolean table, select with where, subtract the row max, and guard the empty rows. Full attention takes O(B·T·D² + B·T²·D) time including projections, and O(B·H·T² + B·T·D) intermediate memory."',
      dojo: '0125', file: '0125_masked_self_attention.py', minutes: 25 }));
}

/* ---------- 2. Contrastive ---------- */
function contrastive() {
  const xa = [0.2, 1.5, 3.0, 4.6];
  const base = [0.15, -0.2, 0.25, -0.1];
  const st = { t: 0.5, noise: 0.4, valid: [true, true, true, true] };
  const body = h('div');
  const draw = () => {

/* ---------- 3. Conv2D ---------- */
function conv() {

  const draw = () => {
    const X = inputs[st.size], K = kernels[st.k];

    const P = res.P;
    const inG = h('table', { class: 'grid' }, P.map((row, i) => h('tr', {}, row.map((v, j) => h('td',
      { class: 'cell' + (inWin(i, j) ? ' win' : '') + (i < st.p || j < st.p || i >= P.length - st.p || j >= P[0].length - st.p ? ' pad' : '') }, v)))));

      { class: 'cell click' + (i === si && j === sj ? ' sel' : ''), style: 'color:var(--text)', tabindex: 0, role: 'button', 'aria-label': `output ${i},${j} = ${v}`,
        onclick: () => { st.sel = [i, j]; draw(); }, onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); st.sel = [i, j]; draw(); } } }, v)))));
    const terms = [];
    for (let u = 0; u < kh; u++) for (let v = 0; v < kw; v++) terms.push(`${P[si * st.s + u][sj * st.s + v]}·${res.kern[u][v] < 0 ? '(' + res.kern[u][v] + ')' : res.kern[u][v]}`);
    body.replaceChildren(
      h('div', { class: 'row' }, h('div', {}, h('p', { class: 'sub' }, 'padded input'), inG), h('div', {}, h('p', { class: 'sub' }, st.flip ? 'kernel (FLIPPED)' : 'kernel'), kG), h('div', {}, h('p', { class: 'sub' }, 'output: click a cell'), outG)),
      h('div', { class: 'kv' }, `out[${si},${sj}] = ${terms.join(' + ')} = ${res.out[si][sj]}`),
      readout([['output size', `${res.ho}×${res.wo}`, 'good'], ['formula', formula]]));
  };
  const ctl = h('div', { class: 'controls' },
    choice('input', [[3, '3×3'], [5, '5×5']], st.size, v => { st.size = v; st.sel = [0, 0]; draw(); }),
    choice('kernel', [['diag', 'diag 2×2'], ['asym', '[[1,2],[3,4]]'], ['sobel', 'sobel 3×3'], ['box', 'box 3×3']], st.k, v => { st.k = v; draw(); }),
    choice('stride', [[1, '1'], [2, '2']], st.s, v => { st.s = v; draw(); }),
    choice('padding', [[0, '0'], [1, '1'], [2, '2']], st.p, v => { st.p = v; draw(); }),
    toggle('flip kernel (true convolution)', st.flip, v => { st.flip = v; draw(); }));

    h('div', { class: 'stage' }, ctl, body),
    guide({
      idea: 'out = Σ over channels and kernel taps of window × weight, with Ho = ⌊(H + 2p − Kh)/s⌋ + 1. Deep-learning "convolution" does NOT flip the kernel; that is cross-correlation.',
      predict: 'Input 1..9 (3×3), kernel [[1,0],[0,−1]], stride 1, pad 0. What is every output cell?',
      answer: '−4 everywhere: each window is [[a,b],[d,e]] and the kernel gives a − e, which is −4 for this ramp. Tick "flip" and it changes, which is exactly the trap.',
      watch: 'Padding must be zeros, not edge values. A loop-based reference is a good first step. Then try patch extraction and contraction: im2col materializes B·Ho·Wo·Cin·Kh·Kw elements, roughly Kh·Kw times the input size for stride 1 and similar spatial dimensions.',

      idea: 'index = floor((p − origin) / size); keep 0 ≤ index < grid_shape on EVERY axis; flatten with ravel_multi_index; np.unique + np.add.at give counts and sums; mean = sum / count.',
      predict: 'x = [0.1, 0.9, 1.0, 2.0] with size 1 and grid_shape (2,1,1). Which voxels, and which point is dropped?',
      answer: 'Voxel 0 gets 0.1 and 0.9; voxel 1 gets 1.0 (the lower edge is inclusive); x = 2.0 is index 2, outside the grid, so it is dropped.',
      watch: 'Use floor, not int(): int(−0.1) is 0 and lets a negative point into voxel 0. Check bounds on the float index BEFORE casting to int, or a huge coordinate overflows.',
      say: '"Floor, bounds-mask on floats, ravel to a flat id, unique with inverse and counts, add.at the sums. With C feature channels: O(N log N + N·C) time; O(N·C + K·C) extra storage for selected features, grouping and K occupied outputs."',
      dojo: '0130', file: '0130_voxel_feature_mean.py', minutes: 15 }));
}

/* ---------- 7. Ego frame ---------- */
function egoLesson() {
  const st = { hx: 10, hy: 0, hth: 0, cx: 7, cy: 0, cth: 0, px: 2, py: 0 };
  const body = h('div');
  const d2r = d => d * Math.PI / 180;
  const sc = 30, ox = 50, oy = 200, W = 560, H = 270;
  const X = x => ox + x * sc, Y = y => oy - y * sc;
  const draw = () => {
    const hp = { x: st.hx, y: st.hy, th: d2r(st.hth) }, cp = { x: st.cx, y: st.cy, th: d2r(st.cth) };
    const r = FM.egoTransform([st.px, st.py], hp, cp);
    const points = [[0, 0], r.world, ...[hp, cp].flatMap(p => [[p.x, p.y], [p.x + 3 * Math.cos(p.th), p.y + 3 * Math.sin(p.th)], [p.x - 2 * Math.sin(p.th), p.y + 2 * Math.cos(p.th)]])];
    const left = Math.min(0, ...points.map(p => X(p[0]) - 95)), right = Math.max(W, ...points.map(p => X(p[0]) + 60));
    const top = Math.min(0, ...points.map(p => Y(p[1]) - 30)), bottom = Math.max(H, ...points.map(p => Y(p[1]) + 30));
    const frame = (p, col, name) => {
      const ax = (th, c) => sv('line', { x1: X(p.x), y1: Y(p.y), x2: X(p.x + 3 * Math.cos(p.th + th)), y2: Y(p.y + 3 * Math.sin(p.th + th)), stroke: c, 'stroke-width': 2.5 });
      return [ax(0, col), sv('line', { x1: X(p.x), y1: Y(p.y), x2: X(p.x - 2 * Math.sin(p.th)), y2: Y(p.y + 2 * Math.cos(p.th)), stroke: col, 'stroke-width': 1.5, opacity: .6 }),
        sv('text', { x: X(p.x) - 6, y: Y(p.y) + 16, 'text-anchor': 'end', style: `fill:${col}` }, name)];
    };
    const svg = sv('svg', { viewBox: `${left} ${top} ${right - left} ${bottom - top}`, width: W, role: 'img', 'aria-label': 'world with two ego frames', style: 'border:1px solid var(--line);border-radius:6px;background:var(--canvas)' },
      sv('line', { x1: X(-1), y1: Y(0), x2: X(17), y2: Y(0), stroke: 'var(--line)' }), sv('line', { x1: X(0), y1: Y(-2), x2: X(0), y2: Y(6), stroke: 'var(--line)' }),
      sv('text', { x: X(0) + 4, y: Y(0) - 4 }, 'world'),
      frame(hp, 'var(--accent)', 'history ego'), frame(cp, 'var(--amber)', 'current ego'),
      sv('circle', { cx: X(r.world[0]), cy: Y(r.world[1]), r: 6, fill: 'var(--purple)' }),
      sv('text', { x: X(r.world[0]) + 8, y: Y(r.world[1]) - 8, style: 'fill:var(--purple)' }, 'point'));
    body.replaceChildren(svg, h('p', { class: 'note' }, 'Top-down slice: z = 0, rotations about z. Bright axis = local x; faint axis = local y. The workout extends the same composition to 3D poses.'), h('div', { class: 'kv' }, `p_hist    = [${fmt(st.px, 2)}, ${fmt(st.py, 2)}]\np_world   = R_h·p_hist + t_h = [${fmt(r.world[0], 2)}, ${fmt(r.world[1], 2)}]\np_current = R_cᵀ·(p_world − t_c) = [${fmt(r.current[0], 2)}, ${fmt(r.current[1], 2)}]`),
      readout([['current x', fmt(r.current[0], 2), 'good'], ['current y', fmt(r.current[1], 2), 'good']]));
  };
  const S = (label, key, min, max, step) => slider(label, min, max, step, st[key], v => { st[key] = v; draw(); }, v => v.toFixed(step < 1 ? 1 : 0));
  const preset = (name, v) => h('button', { class: 'btn', onclick: () => { Object.assign(st, v); render(); } }, name);
  const ctl = h('div', { class: 'controls' });
  const render = () => { ctl.replaceChildren(
    h('div', { class: 'chips' }, h('span', { class: 'ctl' }, 'presets'), preset('+10 vs +7', { hx: 10, hy: 0, hth: 0, cx: 7, cy: 0, cth: 0, px: 2, py: 0 }), preset('rotate 90°', { hx: 0, hy: 0, hth: 90, cx: 0, cy: 0, cth: 0, px: 1, py: 0 }), preset('general', { hx: 6, hy: 2, hth: 35, cx: 9, cy: 1, cth: -20, px: 2, py: 1 })),
    S('history x', 'hx', 0, 16, 0.5), S('history y', 'hy', -2, 6, 0.5), S('history θ°', 'hth', -180, 180, 5),
    S('current x', 'cx', 0, 16, 0.5), S('current y', 'cy', -2, 6, 0.5), S('current θ°', 'cth', -180, 180, 5),
    S('point x', 'px', -3, 3, 0.5), S('point y', 'py', -3, 3, 0.5)); draw(); };
  render();
  return lesson('Move history into the current ego frame',
    'A point is stored in the frame where it was observed. To compare it with now, go through the world: history → world → current.',
    h('div', { class: 'stage' }, ctl, body),
    guide({
      idea: 'current_from_history = inv(world_from_current) · world_from_history. A rigid inverse is [Rᵀ | −Rᵀt], so you never need a general matrix inverse.',
      predict: 'History pose x = +10, current pose x = +7, point [2,0,0] in the history frame. Where is it in the current frame?',
      answer: '[5, 0, 0]: world x is 10 + 2 = 12, and the current frame sits at 7, so 12 − 7 = 5. Click the first preset.',
      watch: 'Order matters: apply the history pose first, then invert the current pose. Mixing up world_from_x and x_from_world gives a mirror-image error that hand-checkable cases catch. Vectorize over B, A, T with einsum and never mutate inputs.',
      say: '"Compose Rcᵀ·Rh and Rcᵀ·(th − tc), then one einsum over [B,A,T]. Time O(B·A·T), memory O(B·A·T)."',
      dojo: '0131', file: '0131_history_to_ego_frame.py', minutes: 10 }));
}

/* ---------- Start + router ---------- */
const LESSONS = [
  ['masks', 'Masks', '0125', masks, 'Padding, causality and empty rows in attention.'],
  ['contrastive', 'Contrastive loss', '0126', contrastive, 'Temperature, logsumexp and the uniform-guess baseline.'],
  ['conv', 'Conv2D', '0127', conv, 'Sliding dot products, stride, padding and the no-flip rule.'],
  ['iou', 'Box IoU', '0128', iouLesson, 'Overlap, union, zero-area boxes and flat gradients.'],
  ['huber', 'Huber', '0129', huberLesson, 'Two regimes, a manual gradient and select-vs-multiply masks.'],
  ['voxel', 'Voxels', '0130', voxelLesson, 'Floor, bounds, flatten, and per-cell means.'],
  ['ego', 'Ego frames', '0131', egoLesson, 'History to world to current with rigid transforms.']
];
function start() {
  return h('div', {}, h('h1', {}, 'Seven fundamentals, one habit'),
    h('p', { class: 'lede' }, 'Predict, change one input, explain what happened, then write the code in the dojo. Start with attention, contrastive loss, Conv2D and IoU, in that order. Huber, voxels and ego frames extend the practice if time remains. The widgets isolate one idea; the linked workouts cover the full tensor contracts.'),
    h('p', { class: 'note', style: 'margin:0 0 20px' }, h('a', { href: 'https://github.com/phi9t/torch_dojo/blob/main/docs/practice/numpy-torch-cheatsheet.md' }, 'NumPy / PyTorch cheatsheet'), ' — formulas, shape patterns, API translations and practice checks.'),
    h('div', { class: 'start' }, LESSONS.map(([id, name, num, , blurb]) => h('button', { onclick: () => go(id) },
      h('span', { class: 'm' }, `dojo ${num}`), h('span', { class: 't' }, name), h('p', {}, blurb)))));
}
const tabs = document.getElementById('tabs'), view = document.getElementById('view');
const ALL = [['start', 'Start', '', start], ...LESSONS];
ALL.forEach(([id, name, num]) => tabs.append(h('button', { role: 'tab', id: 'tab-' + id, 'aria-controls': 'view', 'aria-selected': 'false', tabindex: -1, onclick: () => go(id) }, h('span', { class: 'n' }, num || '·'), name)));
tabs.addEventListener('keydown', e => {
  const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
  if (!keys.includes(e.key)) return;
  const i = [...tabs.children].indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const next = e.key === 'Home' ? 0 : e.key === 'End' ? ALL.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + ALL.length) % ALL.length;
  tabs.children[next].focus(); go(ALL[next][0]);
});
function go(id) { location.hash = id; }
function route() {
  const id = (location.hash || '#start').slice(1);
  const item = ALL.find(x => x[0] === id) || ALL[0];
  for (const b of tabs.children) {
    const selected = b.id === 'tab-' + item[0];
    b.setAttribute('aria-selected', String(selected)); b.tabIndex = selected ? 0 : -1;
  }
  view.setAttribute('aria-labelledby', 'tab-' + item[0]);
  view.replaceChildren(item[3]());
  document.title = (item[0] === 'start' ? 'Dojo Fundamentals' : item[1] + ' · Dojo Fundamentals');
}
addEventListener('hashchange', route);
const themeBtn = document.getElementById('theme');
function setTheme(t) {
  document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'light' ? 'Dark' : 'Light'; themeBtn.setAttribute('aria-pressed', String(t === 'light'));
  try { localStorage.setItem('dojo-theme', t); } catch (e) { /* storage may be blocked */ }
}
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
let saved = null; try { saved = localStorage.getItem('dojo-theme'); } catch (e) { /* ignore */ }
setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
route();
</script>
